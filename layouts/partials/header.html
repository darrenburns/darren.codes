<header class="site-header">
  <div class="wrap header-inner">
    <a class="wordmark" href="{{ "/" | relURL }}" aria-label="{{ site.Title }}, home">
      <span class="wordmark-prompt" aria-hidden="true">~/</span>darren.codes<span class="wordmark-cursor" aria-hidden="true"></span>
    </a>
    <nav class="site-nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      {{- $active := or ($current.IsMenuCurrent "main" .) (eq (strings.TrimSuffix "/" $current.RelPermalink) (strings.TrimSuffix "/" .URL)) (and (eq .URL "/posts/") (eq $current.Section "posts")) }}
      <a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name | lower }}</a>
      {{- end }}
      <button class="theme-toggle" type="button" aria-label="Toggle colour theme" title="Toggle theme">
        <span class="when-dark">{{ partial "icon.html" "sun" }}</span>
        <span class="when-light">{{ partial "icon.html" "moon" }}</span>
      </button>
    </nav>
  </div>
</header>
