{{ define "main" }}
<div class="wrap">
  <header class="page-head">
    <p class="kicker">index</p>
    <h1 class="page-title">Tags</h1>
  </header>
  <ul class="tag-grid">
    {{- range .Data.Terms.ByCount }}
    <li><a href="{{ .Page.RelPermalink }}"><span>#{{ .Name }}</span><span class="tag-count">{{ .Count }}</span></a></li>
    {{- end }}
  </ul>
</div>
{{ end }}
